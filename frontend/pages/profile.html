<!-- Arquivo: profile.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Perfil | BuscaPet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/profile.css">
</head>

<body>

  <header class="app-header">
    <button class="header-icon" type="button" aria-label="Voltar" onclick="window.location.href='home.html'">
      <i class="fa-solid fa-arrow-left"></i>
    </button>

    <div class="header-spacer" aria-hidden="true"></div>

    <button class="header-icon" type="button" aria-label="Conversas" onclick="window.location.href='conversations.html'">
      <i class="fa-solid fa-comments"></i>
    </button>
  </header>

  <main class="profile-wrap">
    <section class="profile-card">
      <div class="profile-avatar">
        <img id="profileAvatarImg" alt="Foto de perfil">
        <i id="profileAvatarIcon" class="fa-solid fa-circle-user"></i>
      </div>

      <div class="profile-info">
        <h1>
          <span id="profileName">Carregando...</span>

          <button id="btnEditProfile" class="profile-edit-btn" type="button" aria-label="Editar perfil" title="Editar perfil">
            <i class="fa-solid fa-pen"></i>
          </button>
        </h1>

        <p class="profile-sub" id="profileUser">@...</p>
        <p class="profile-sub" id="profileEmail">...</p>
      </div>

      <button class="profile-logout" type="button" onclick="logout()">
        <i class="fa-solid fa-right-from-bracket"></i>
        Sair
      </button>
    </section>

    <section class="profile-section">
      <h2>Meus animais</h2>
      <div id="profileAnimalsList" class="profile-animals">
        <p class="muted">Carregando...</p>
      </div>
    </section>
  </main>

  <!-- MODAL EDITAR PERFIL -->
  <div class="modal" id="editProfileModal" hidden>
    <div class="modal-panel" role="dialog" aria-label="Editar perfil">
      <div class="modal-head">
        <h3>Editar perfil</h3>
      </div>

      <div class="modal-body">
        <div class="modal-field">
          <label for="editProfileName">Nome</label>
          <input id="editProfileName" type="text" placeholder="Seu nome">
        </div>

        <div class="modal-field">
          <label for="editProfileUsername">Username</label>
          <input id="editProfileUsername" type="text" placeholder="usuario">
        </div>

        <div class="modal-field">
          <label for="editProfileEmail">Email</label>
          <input id="editProfileEmail" type="email" placeholder="email@exemplo.com">
        </div>

        <!-- Upload bonito + prévia -->
        <div class="modal-field">
          <label>Foto de perfil</label>

          <label class="upload-box" for="editProfileAvatar">
            <input id="editProfileAvatar" class="upload-input" type="file" accept="image/*">
            <div class="upload-inner">
              <div class="upload-icon"><i class="fa-solid fa-camera"></i></div>
              <div class="upload-text" id="editProfileUploadText">Clique para escolher uma foto</div>
            </div>
          </label>

          <div id="avatarPreviewGrid" class="photo-grid" style="grid-template-columns: repeat(1, 1fr); margin-top:10px;"></div>
        </div>

        <div class="modal-msg" id="profileEditMsg"></div>

        <button id="btnDeleteAccount" class="danger-btn" type="button">
          Excluir minha conta
        </button>
      </div>

      <div class="modal-actions">
        <button class="modal-btn cancel" id="btnCancelProfileEdit" type="button">Cancelar</button>
        <button class="modal-btn save" id="btnSaveProfileEdit" type="button">Salvar</button>
      </div>
    </div>
  </div>

  <!-- SCRIPTS (ordem importa) -->
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/profile.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof window.checkAuth === 'function') window.checkAuth();
    });
  </script>

  <!-- BOTÃO FLUTUANTE DE CONVERSAS -->
  <button
    class="fab-conversations"
    type="button"
    aria-label="Conversas"
    title="Conversas"
    onclick="window.location.href='conversations.html'"
  >
    <i class="fa-solid fa-comments"></i>
  </button>

</body>
</html>
