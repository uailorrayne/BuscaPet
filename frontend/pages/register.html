<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!--
    Arquivo: register.html
    Descrição: Cadastro de usuário (layout estilo app/tinder)
    Projeto: BuscaPet
  -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar Conta | BuscaPet</title>

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />

  <!-- CSS -->
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>

<body class="auth-page">

  <div class="auth-wrap">
    <div class="auth-card">

      <!-- Logo -->
      <div class="auth-top">
        <img src="../assets/images/logoapp.png" alt="Logo BuscaPet">
      </div>

      <div class="auth-body">
        <h2>Criar Conta</h2>

        <!--
          Observação:
          Você já usa register(); aqui continua igual.
          Se ainda não implementou register() no ../js/auth.js,
          o botão vai chamar uma função que não existe.
        -->
        <form class="auth-form" onsubmit="event.preventDefault(); register();">

          <div class="field">
            <i class="fa-solid fa-user"></i>
            <input
              type="text"
              id="fullName"
              placeholder="Nome completo"
              required
            >
          </div>

          <div class="field">
            <i class="fa-solid fa-at"></i>
            <input
              type="text"
              id="username"
              placeholder="Usuário"
              required
            >
          </div>

          <div class="field">
            <i class="fa-solid fa-envelope"></i>
            <input
              type="email"
              id="email"
              placeholder="E-mail"
              required
            >
          </div>

          <div class="field">
            <i class="fa-solid fa-lock"></i>
            <input
              type="password"
              id="password"
              placeholder="Senha"
              required
            >
          </div>

          <button type="submit" class="btn btn-primary">Cadastrar</button>
        </form>
      </div>

      <div class="auth-footer">
        Já tem uma conta?
        <a href="login.html">Entrar</a>
      </div>

    </div>
  </div>

  <script src="../js/auth.js"></script>

</body>
</html>
